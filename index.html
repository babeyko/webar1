<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задание 1: model-viewer</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <h1>Лошадь в дополненной реальности</h1>
  <p>Вращай модель. На телефоне нажми встроенную кнопку AR.</p>
  <!-- GLB для браузера и Android, USDZ для Quick Look на iOS. -->
  <model-viewer
    src="../Horse.glb"
    ios-src="../Horse.usdz"
    alt="Коричневая low-poly лошадь"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    camera-orbit="90deg 75deg 105%"
    environment-image="../environment.hdr"
    shadow-intensity="1"
    style="width: 100%; height: 70vh;">
  </model-viewer>
</body>
</html>
